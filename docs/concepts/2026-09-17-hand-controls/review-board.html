<!doctype html>

<title>AIRPLANEVOICE — 動き3案の動画と、手で触れるVR／ARの画面案</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #181818; }
main { padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
figure { margin: 0; }
img { width: 100%; height: auto; display: block; border: 1px solid #e5e5e5; border-radius: 8px; background: #fafafa; }
figcaption { margin-top: 8px; font-size: 13px; line-height: 1.3; color: #333; }
.prompt-card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px; background: #fafafa; }
.prompt-card figcaption { margin-top: 0; font-weight: 700; }
.prompt-card figcaption span { display: inline-block; margin-left: 6px; color: #7a4b16; font-weight: 600; }
.prompt-card p { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: #555; }
.empty-state { border: 1px solid #e5e5e5; border-radius: 8px; padding: 18px; color: #555; background: #fafafa; }

</style>
</head>
<body><main><div class="grid"><figure><a href="01-vr-pinch.png"><img src="01-vr-pinch.png" alt="VR｜遠くは指してつまむ、手元に操作盤。将来の画面案・実機撮影ではありません。"></a><figcaption>01. VR｜遠くは指してつまむ、手元に操作盤。将来の画面案・実機撮影ではありません。</figcaption></figure><figure><a href="02-ar-touch.png"><img src="02-ar-touch.png" alt="AR｜目の前のメニューへ指で触れる。架空の会場・将来の画面案。"></a><figcaption>02. AR｜目の前のメニューへ指で触れる。架空の会場・将来の画面案。</figcaption></figure><figure><a href="03-motion-lift.webm"><img src="03-motion-lift.png" alt="▶ 浮上｜実装画面の録画。ふわっと浮かび、静かに収まる。普段の操作の第一候補。 音声なし。クリックで動画。"></a><figcaption>03. ▶ 浮上｜実装画面の録画。ふわっと浮かび、静かに収まる。普段の操作の第一候補。 音声なし。クリックで動画。</figcaption></figure><figure><a href="04-motion-trail.webm"><img src="04-motion-trail.png" alt="▶ 航跡｜実装画面の録画。細い線と順番に現れるボタン。航空機らしさを比較。 音声なし。クリックで動画。"></a><figcaption>04. ▶ 航跡｜実装画面の録画。細い線と順番に現れるボタン。航空機らしさを比較。 音声なし。クリックで動画。</figcaption></figure><figure><a href="05-motion-ripple.webm"><img src="05-motion-ripple.png" alt="▶ 音の波｜実装画面の録画。波紋から面が広がる。聴き方の操作などへの候補。 音声なし。クリックで動画。"></a><figcaption>05. ▶ 音の波｜実装画面の録画。波紋から面が広がる。聴き方の操作などへの候補。 音声なし。クリックで動画。</figcaption></figure></div></main></body>
